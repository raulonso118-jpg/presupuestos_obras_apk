name: Build Presupuestos de Obra APK

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake

      - name: Instalar buildozer
        run: pip install "buildozer==1.5.0" "cython==0.29.36"

      - name: Compilar APK
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: presupuestos-obras-apk
          path: bin/*.apk
